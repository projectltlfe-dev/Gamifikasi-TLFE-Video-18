<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Root Cause Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#22314d;--muted:#5d6b85;--teal:#2f8f83;--teal-d:#1f6f6a;--orange:#e07b3c;--red:#e5484d;--good:#1f9e5a;
  --disp:'Baloo 2','Nunito',system-ui,sans-serif;--fn:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e3f1ee;overscroll-behavior:none}
body{font-family:var(--fn);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;user-select:text;-webkit-user-select:text}
.hide{display:none!important}

/* ===== bingkai: isi maks 600px, latar menyambung ===== */
#app{position:relative;width:100%;height:min(177.78vw,600px);overflow:hidden;background:#e3f1ee}
#world{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:filter .4s}
#world .wl{position:absolute;inset:0;opacity:0;transition:opacity .45s}
#world .wl.on{opacity:1}
#world svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#wCine{background:#12343a}
#stage{position:absolute;left:50%;top:50%;width:360px;height:640px;overflow:hidden;transform:translate(-50%,-50%);transform-origin:50% 50%;z-index:1}
.layer{position:absolute;inset:0}
#decor svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#decor,#actors,#roomUI,#hud{transition:filter .4s,opacity .35s}
#app.dim #world,#app.dim #decor,#app.dim #actors,#app.dim #roomUI,#app.dim #hud{filter:brightness(.42) saturate(.8)}

/* ===== tokoh ===== */
.fig{position:absolute;width:170px;height:340px}
.fig svg{width:100%;height:100%;display:block;overflow:visible}
#pt{left:178px;top:112px;z-index:3}
#denny{left:95px;top:110px;z-index:3}
.fig.idle svg{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.fig.shake svg{animation:shk .5s}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fig.hop svg{animation:hop .6s}@keyframes hop{40%{transform:translateY(-12px)}}
.zn{fill:transparent;cursor:pointer}
#pt.guide .zn:not(.done){fill:rgba(47,158,149,.24);stroke:#fff;stroke-width:1.3;stroke-dasharray:4 3;animation:zp 1s infinite}
@keyframes zp{50%{fill:rgba(47,158,149,.45)}}
.ping{position:absolute;width:34px;height:34px;margin:-17px;border-radius:50%;border:4px solid #2f9e95;animation:ping .7s ease-out forwards;pointer-events:none;z-index:6}
@keyframes ping{to{transform:scale(2.3);opacity:0}}

/* ===== HUD ===== */
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:35}
#hr{display:flex;gap:6px;align-items:center}
.chip{background:rgba(255,255,255,.96);border-radius:999px;padding:5px 10px;font:800 12px var(--fn);box-shadow:0 3px 10px rgba(0,0,0,.14);display:flex;gap:6px;align-items:center;white-space:nowrap;color:var(--ink)}
.chip.hit{animation:hit .5s}@keyframes hit{30%{transform:scale(1.16)}}
.mb{display:inline-block;width:44px;height:8px;border-radius:5px;background:#dfe6ee;overflow:hidden}
.mb b{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fb5a6,#2a8f83);transition:width .7s}
#hab{position:absolute;right:8px;top:44px;z-index:34;font-size:11px;padding:4px 9px}
#hab u{display:inline-block;width:8px;height:8px;border-radius:50%;background:#dfe6ee}#hab u.on{background:var(--orange)}
#hab.warn{background:#ffe3e3;animation:warn .8s infinite}#hab.warn u.on{background:var(--red)}
@keyframes warn{50%{box-shadow:0 0 0 4px rgba(229,72,77,.5)}}
#bgm{width:40px;height:30px;border-radius:999px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.16);display:grid;place-items:center}
#bgm svg{width:26px;height:22px}
#bgm .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
#bgm .eq rect:nth-child(2){animation-delay:.25s}#bgm .eq rect:nth-child(3){animation-delay:.5s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#bgm .x{display:none}#bgm.off .eq{display:none}#bgm.off .x{display:inline}

/* ===== tombol ===== */
.btn{font:800 16px/1.1 var(--disp);border-radius:15px;padding:10px 20px;color:#fff;background:linear-gradient(180deg,#3fb5a6,#2a8f83);box-shadow:0 5px 0 #1d6b62,0 8px 16px rgba(31,111,106,.3);transition:transform .1s,box-shadow .1s,opacity .2s}
.btn.orange{background:linear-gradient(180deg,#f39a55,#d86f2c);box-shadow:0 5px 0 #a8531c,0 8px 16px rgba(224,123,60,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d6b62}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.07)}}
.btn.wide{width:100%}

/* ===== rekam medis (clipboard) ===== */
#chart{position:absolute;left:8px;top:56px;width:164px;height:404px;z-index:4;background:linear-gradient(160deg,#c08a55,#93602f);border-radius:12px;padding:17px 6px 6px;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3)}
#chart .clip{position:absolute;left:50%;top:-7px;width:64px;height:21px;transform:translateX(-50%);background:linear-gradient(#f2f4f6,#9aa5b1);border-radius:7px 7px 4px 4px;box-shadow:0 2px 3px rgba(0,0,0,.35)}
#chart .clip::after{content:'';position:absolute;left:50%;top:5px;width:24px;height:7px;margin-left:-12px;border-radius:4px;background:#5d6876}
.paper{height:100%;background:#fffdf8;border-radius:5px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:inset 0 0 0 1px #ece4d3}
.ch-h{display:flex;justify-content:space-between;align-items:center;font:900 8.5px var(--fn);letter-spacing:.8px;color:#9aa5b1}
.ch-h b{color:var(--red)}
.ch-n{font:800 14.5px/1.05 var(--disp);color:var(--ink)}
.ch-r{font:800 9.5px var(--fn);color:var(--muted);margin-top:-3px}
.ch-k{font:800 10.5px/1.3 var(--fn);color:#6b4f2a;background:#fff1d0;border-radius:6px;padding:3px 6px}
.slot{display:block;text-align:left;width:100%;border-top:1.5px dashed #d6dde6;padding:5px 3px 3px;border-radius:0;transition:background .3s}
.slot .sl{display:flex;align-items:center;gap:5px;font:800 12px/1.1 var(--disp);color:var(--teal-d)}
.slot .sl i{font-style:normal;font-size:13px}
.slot .sl em{margin-left:auto;font:900 9px var(--fn);font-style:normal;color:#b9c2cd}
.slot p{font:700 10.4px/1.33 var(--fn);color:#a7b0bc;margin-top:2px;font-style:italic}
.slot.found p{color:#26324b;font-style:normal;animation:fd .45s}
.slot.found .sl em{color:var(--good)}
.slot.shut p{color:var(--red);font-style:normal}
#chart.nudge .slot:not(.found){background:rgba(224,123,60,.12);border-radius:7px}
@keyframes fd{from{opacity:0;transform:translateY(4px)}}

/* ===== meja & alat ===== */
#trayWrap{position:absolute;left:0;right:0;top:470px;height:150px;z-index:5}
#trayHd{position:absolute;left:12px;top:4px;font:800 11px var(--fn);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
#trayHd.on{opacity:1}
#plate{position:absolute;right:12px;top:2px;background:linear-gradient(#3e475c,#252b3a);color:#fff;font:700 10.5px var(--disp);padding:1px 10px;border-radius:5px;box-shadow:0 2px 0 #12161f;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray{position:absolute;left:10px;right:10px;top:26px;height:108px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .3s,transform .35s var(--spring)}
#tray.on{opacity:1;pointer-events:auto;transform:none}
.tool{position:relative;background:linear-gradient(#fffefb,#f2ece0);border-radius:16px;box-shadow:0 5px 0 #6b4424,0 9px 14px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;transition:transform .1s,box-shadow .1s,opacity .25s,filter .25s}
.tool svg{width:58px;height:48px}
.tool b{font:800 12.5px/1.05 var(--disp);color:var(--ink);text-align:center}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 #6b4424}
.tool.x{opacity:.5;pointer-events:none;filter:grayscale(.8)}
.tool.x::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font:800 58px/1 var(--disp);color:rgba(229,72,77,.9)}
.tool.ok{background:linear-gradient(#e6fbef,#c8f0d8);animation:glw 1s 2}
@keyframes glw{50%{box-shadow:0 5px 0 #6b4424,0 0 0 6px #5fd68c}}

/* ===== pengingat & pemandu ===== */
#remind{position:absolute;left:50%;top:438px;transform:translateX(-50%);z-index:26;background:#fff7d6;border:2px solid var(--orange);color:#6a3e12;border-radius:999px;padding:5px 13px;font:800 12px var(--fn);white-space:nowrap;box-shadow:0 5px 14px rgba(0,0,0,.22);display:none}
#remind.on{display:block;animation:rpop .45s var(--spring)}
@keyframes rpop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#hand{position:absolute;left:0;top:0;width:0;height:0;z-index:27;display:none;pointer-events:none;transition:transform .55s ease}
#hand.on{display:block}
#hand .rp{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px rgba(47,143,131,.55);animation:rp 1.2s ease-out infinite}
#hand .hd{position:absolute;left:-9px;top:-2px;width:42px;height:42px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));animation:press 1.2s ease-in-out infinite}
@keyframes rp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes press{0%,100%{transform:translate(6px,8px)}40%{transform:translate(0,0) scale(.92)}}

/* ===== dialog ===== */
#story{position:absolute;left:10px;right:10px;bottom:22px;z-index:30;background:#fff;border-radius:20px;padding:11px 14px 12px;box-shadow:0 6px 0 rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.28);display:none;flex-direction:column;gap:7px}
#story.on{display:flex;animation:up .35s var(--spring)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.spk{display:flex;align-items:center;gap:9px}
.av{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#f3fbf9,#cfeae5);border:2px solid var(--teal);overflow:hidden;flex:none;display:block}
.av svg{width:100%;height:100%;display:block}
.who{font:800 15px/1.05 var(--disp);color:var(--teal-d)}
.who small{display:block;font:800 10.5px var(--fn);color:var(--muted)}
#sTxt{font-weight:800;font-size:14px;line-height:1.38}
#sTxt.fade{animation:fd .35s}
#sBtn{align-self:flex-end;padding:8px 18px;font-size:15px}

/* ===== notifikasi, toast, modal, cine ===== */
#notif{position:absolute;left:8px;right:8px;top:46px;z-index:40;background:#fff;border-radius:16px;padding:8px 10px 9px;display:none;gap:9px;align-items:flex-start;box-shadow:0 10px 24px rgba(0,0,0,.3);font:700 12px/1.35 var(--fn);border-left:5px solid var(--teal)}
#notif.on{display:flex;animation:sl .4s}@keyframes sl{from{opacity:0;transform:translateY(-14px)}}
#notif.good{border-left-color:var(--good)}#notif.bad{border-left-color:var(--orange)}
#notif small{display:block;font-size:10px;color:var(--muted);font-weight:900}
#notif .av{width:34px;height:34px}
#toast{position:absolute;top:290px;left:50%;transform:translate(-50%,-50%) scale(.85);background:#fff;padding:10px 18px;border-radius:16px;font:900 15px/1.3 var(--fn);opacity:0;transition:.25s;z-index:45;box-shadow:0 10px 26px rgba(0,0,0,.3);pointer-events:none;text-align:center;width:max-content;max-width:300px}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.mid{color:#c46a12}#toast.good{color:var(--good)}
.ftx{position:absolute;font:800 18px var(--disp);white-space:nowrap;pointer-events:none;z-index:46;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
#modal{position:absolute;inset:0;z-index:60;display:none;place-items:center;padding:18px}
#modal.on{display:grid}
.mcard{width:100%;background:#fff;border-radius:24px;padding:18px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.4);animation:pop .4s}
.mcard .ic{font-size:44px}.mcard h3{font:800 21px/1.15 var(--disp);color:var(--red);margin:4px 0 6px}.mcard p{font-weight:700;line-height:1.35;margin-bottom:8px;font-size:14px}
.pen{display:inline-block;background:#ffe3e3;color:var(--red);font-weight:900;border-radius:99px;padding:3px 12px;margin-bottom:12px;font-size:12.5px}
#cine{position:absolute;inset:0;z-index:58;background:#12343a;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .45s;text-align:center;color:#fff}
#cine.on{opacity:1;pointer-events:auto}
#cine small{display:block;font-weight:900;letter-spacing:.14em;color:#8fd8cd;font-size:13px}
#cine b{display:block;font:800 36px/1.05 var(--disp);margin:6px 0}
#cine span{font-weight:700;color:#cfe3e1;font-size:14px}
#cine i{display:block;font-style:normal;font-size:40px;margin-bottom:6px}

/* ===== kartu UI ===== */
#ui{z-index:50;pointer-events:none}
#ui>*{pointer-events:auto}
.card{position:absolute;left:14px;right:14px;background:rgba(255,255,255,.98);border-radius:24px;padding:16px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.08),0 18px 40px rgba(31,80,80,.3)}
.sCard{top:50%;transform:translateY(-50%)}
.sCard .logo{width:54px;height:54px;margin:0 auto 4px;border-radius:16px;background:linear-gradient(160deg,#3fb5a6,#1f6f6a);display:grid;place-items:center;box-shadow:0 4px 0 #165650}
.sCard .logo svg{width:34px;height:34px}
.sCard h1{font:800 31px/1 var(--disp);color:var(--teal-d)}
.sCard h1 span{display:block;color:var(--orange);font-size:21px;margin-top:2px}
.sub{color:var(--muted);font-weight:800;font-size:13px;margin:6px 0 10px}
.lbl{font-weight:900;font-size:13.5px;margin-bottom:7px}
.chars{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.cc{flex:1;max-width:130px;background:#f1f8f7;border:3px solid #e1eeeb;border-radius:18px;padding:4px 4px 6px;font:800 15px var(--disp);color:var(--ink);display:flex;flex-direction:column;align-items:center;transition:all .2s}
.cc svg{width:74px;height:80px}
.cc.sel{border-color:var(--teal);background:#dff3ef;transform:translateY(-3px);box-shadow:0 4px 0 var(--teal)}
#nameIn{width:100%;border:3px solid #cfe0dd;border-radius:14px;padding:9px 12px;font:800 16px var(--fn);text-align:center;margin-bottom:6px;color:var(--ink);outline:none;background:#f7fbfa}
#nameIn:focus{border-color:var(--teal);background:#fff}
.pv{font:800 11px var(--fn);color:var(--muted);min-height:15px;margin-bottom:9px}.pv b{color:var(--teal-d)}
.snd{font:800 10px var(--fn);color:#9aa5b5;margin-top:9px}
.gCard{top:50%;transform:translateY(-50%);padding:16px 15px}
.gCard h2{font:800 23px var(--disp);color:var(--teal-d)}
.steps{display:grid;gap:7px;margin:10px 0;text-align:left}
.steps>div{display:flex;gap:10px;align-items:center;background:#f1f8f7;border-radius:14px;padding:8px 10px}
.steps .n{flex:none;width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 2px 0 #d5e7e3}
.steps b{display:block;font:800 13.5px/1.15 var(--disp)}
.steps span{font:700 11px/1.3 var(--fn);color:#4f5e70}
.score2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.score2 div{border-radius:13px;padding:8px 6px;font:700 11px/1.3 var(--fn);color:#3b4660}
.score2 b{display:block;font:800 22px/1 var(--disp)}
.score2 .a{background:#d7f7e8}.score2 .a b{color:#157a45}
.score2 .b{background:#fff0d6}.score2 .b b{color:#b46412}

/* kilas balik */
#rwrap{position:absolute;left:12px;right:12px;top:16px;bottom:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
.flip{width:100%;height:430px;perspective:1200px}
.fc{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.flip.flipped .fc{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:24px;padding:16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.32);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fffbe8;justify-content:flex-start;gap:7px}
.k{font-weight:900;font-size:11.5px;background:#dff3ef;color:var(--teal-d);border-radius:99px;padding:2px 12px}
.face h3{font:800 20px/1.12 var(--disp)}
.face p{font-weight:700;font-size:13.5px;line-height:1.36;color:#3b4660}
.face.back h3{font-size:17px}.face.back p{font-size:12.4px;text-align:left}
.face p.wr{background:#fff0e6;border-radius:10px;padding:6px 9px}
.vid{background:#e9f1ff;border:2px dashed #7aa0d8;border-radius:12px;padding:6px 10px;font-weight:700;font-size:12.6px;line-height:1.35;text-align:left}
.pfig{width:112px;height:150px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#f3fbf9,#cfeae5);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden;flex:none}.pfig svg{width:100%;height:100%;display:block}
.prow{display:flex;gap:6px;justify-content:center}.prow span{width:42px;height:42px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#f3fbf9,#cfeae5);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}.prow svg{width:100%;height:100%;display:block}
.dBub{position:absolute;left:116px;right:12px;top:62px;z-index:51;background:#fff;border-radius:18px;padding:10px 12px;font:800 13px/1.4 var(--fn);box-shadow:0 8px 20px rgba(0,0,0,.25)}.dBub::before{content:'';position:absolute;left:-7px;top:34px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}.dBub b{color:var(--teal-d)}
.dCard{top:254px;bottom:26px;overflow:auto;padding:10px 12px;text-align:left}.dCard ul{list-style:none;display:grid;gap:6px}.dCard li{display:flex;gap:8px;align-items:flex-start;background:#f1f8f7;border-radius:12px;padding:5px 9px;font:700 11.6px/1.33 var(--fn);color:#2e3b55}.dCard li i{font-style:normal;font-size:16px;flex:none}.dCard li b{color:var(--teal-d)}.dCard .ask{font:800 14px/1.25 var(--disp);color:var(--teal-d);text-align:center;margin:7px 0 7px}
.ill{width:104px;height:104px;background:radial-gradient(circle at 50% 35%,#f3fbf9,#cfeae5);border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ill svg{width:100%;height:100%}
.res{display:inline-block;border-radius:12px;padding:5px 12px;font:800 13px var(--fn)}
.res.a{background:#d7f7e8;color:#157a45}.res.b{background:#fff0d6;color:#a15a10}
.tap{font-size:12px;font-weight:800;color:var(--orange)}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.45}.dots i.on{opacity:1;background:var(--orange)}.dots i.ok{opacity:1;background:#5fd68c}
/* akhir */
.fcard{position:absolute;left:12px;right:12px;top:14px;bottom:28px;overflow:auto;background:#fff;border-radius:26px;padding:14px 16px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:6px}
.fcard .fav{width:88px;height:88px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#f3fbf9,#cfeae5);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15);flex:none}
.fcard .fav svg{width:100%;height:100%}
.fcard h2{font:800 23px/1.1 var(--disp);color:var(--teal-d)}
.stars{display:flex;justify-content:center;gap:8px;font-size:30px}
.stars span{filter:grayscale(1);opacity:.3;transition:.4s}.stars span.on{filter:none;opacity:1;transform:scale(1.15)}
.ending{display:inline-block;font-weight:900;font-size:12.5px;padding:4px 12px;border-radius:12px}
.ending.good{background:#d7f7e8;color:#157a45}.ending.mid{background:#fff0bd;color:#8a6200}.ending.bad{background:#ffe3e3;color:#b02a2f}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.st{background:#f1f8f7;border-radius:12px;padding:6px 2px}.st b{display:block;font:800 21px/1.1 var(--disp);color:var(--teal-d)}.st span{font-size:10.5px;font-weight:800;color:#4f5e70}
.fcard p{font-weight:700;font-size:12.8px;line-height:1.38;color:#3b4660}
.fcard .closing{background:#12343a;color:#e6f4f1;border-radius:14px;padding:9px 12px;text-align:left}
.fcard .closing b{color:#ffd28a}
.confetti{position:absolute;top:-12px;width:8px;height:12px;animation:fall linear forwards;z-index:70;pointer-events:none}
@keyframes fall{to{transform:translateY(680px) rotate(540deg)}}
#copy{position:absolute;left:0;right:0;bottom:5px;text-align:center;z-index:66;pointer-events:none}
#copy span{display:inline-block;font:700 9px var(--fn);color:rgba(255,255,255,.95);background:rgba(18,40,48,.55);padding:2px 9px;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

<body>
<div id="app">
 <div id="world"><div class="wl on" id="wLobby"><svg id="wsL"></svg></div><div class="wl" id="wRoom"><svg id="wsR"></svg></div><div class="wl" id="wCine"></div></div>

 </div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let salam='',nameP='';
const fill=s=>String(s).replace(/\{s\}/g,salam).replace(/\{n\}/g,esc(nameP));
const app=$('#app'),stage=$('#stage');

/* ================= UKURAN: tinggi isi maks 600px ================= */
let SCALE=1,lastH=0,frameTries=0;
const isTyping=()=>{const a=document.activeElement;return !!a&&a.tagName==='INPUT'};
function screenH(){let v=0;try{v=window.top.innerHeight}catch(e){try{v=window.parent.innerHeight}catch(e2){}}
  if(!v||v<320){const sh=(window.screen&&screen.availHeight)||0;v=Math.max(innerHeight,sh?Math.min(sh,900):600)}return v}
function growFrame(H){try{const fe=window.frameElement;if(!fe)return;fe.style.height=H+'px';fe.style.minHeight=H+'px';fe.setAttribute('height',H);fe.setAttribute('scrolling','no');
  const P=window.parent;if(P&&P.H5P&&P.H5P.instances&&P.H5P.trigger)P.H5P.instances.forEach(i=>{try{P.H5P.trigger(i,'resize')}catch(e){}});
  if(frameTries++<4)setTimeout(()=>{try{if(Math.abs(fe.getBoundingClientRect().height-H)>2){fe.style.height=H+'px';fe.style.minHeight=H+'px'}}catch(e){}},300)}catch(e){}}
function fit(force){
  if(!force&&isTyping())return;
  const W=document.documentElement.clientWidth||innerWidth;
  const H=Math.max(300,Math.min(600,Math.round(W*16/9),screenH()-4));
  if(Math.abs(H-lastH)>=2){lastH=H;growFrame(H)}
  const AH=Math.max(H,Math.round(innerHeight||document.documentElement.clientHeight||H));
  app.style.height=AH+'px';
  const s=Math.min(W/360,H/640);SCALE=s;
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  drawWorld(W,AH,s);
}
const rectStage=el=>{const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(r.left-s.left)/SCALE,y:(r.top-s.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE}};

/* Latar dunia (dinding, lantai, meja) digambar dalam koordinat panggung lalu diperluas ke seluruh layar */
let worldKey='';
function deskBand(x,w,y1){let s=`<rect x="${x}" y="470" width="${w}" height="20" fill="#d9a66e"/><rect x="${x}" y="470" width="${w}" height="3" fill="#efc48e"/><rect x="${x}" y="488" width="${w}" height="6" fill="#a8743f"/><rect x="${x}" y="494" width="${w}" height="${Math.max(0,y1-494)}" fill="#8a5a33"/>`;
  for(let k=Math.floor(x/120);k<=Math.ceil((x+w)/120);k++)s+=`<rect x="${k*120-1}" y="500" width="2" height="${Math.max(0,y1-500)}" fill="#76492a"/>`;return s}
function drawWorld(W,AH,s){
  const key=W+'x'+AH+'@'+s.toFixed(4);if(key===worldKey)return;worldKey=key;
  const L=(W-360*s)/2,T=(AH-640*s)/2,x0=-L/s,y0=-T/s,w=W/s,hh=AH/s,x1=x0+w,y1=y0+hh,vb=`${x0} ${y0} ${w} ${hh}`;
  const ceil=c=>y0<6?`<rect x="${x0}" y="${y0}" width="${w}" height="${6-y0}" fill="${c}"/><rect x="${x0}" y="4" width="${w}" height="4" fill="rgba(0,0,0,.06)"/>`:'';
  const lights=y=>{let o='';if(y0<-10)for(let k=Math.floor(x0/150);k<=Math.ceil(x1/150);k++)o+=`<rect x="${k*150+35}" y="${y}" width="80" height="9" rx="4" fill="#fffef5" stroke="#e3e9ea" stroke-width="2"/>`;return o};
  /* lobi */
  let l=`<rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="#e3f1ee"/>`+ceil('#f6f9f9')+lights(-26);
  for(let k=Math.floor(x0/60);k<=Math.ceil(x1/60);k++)l+=`<rect x="${k*60}" y="8" width="1.5" height="188" fill="#d6e8e4"/>`;
  l+=`<rect x="${x0}" y="196" width="${w}" height="12" fill="#2f9e95"/><rect x="${x0}" y="208" width="${w}" height="92" fill="#cfe5e0"/><rect x="${x0}" y="296" width="${w}" height="8" fill="#93b5af"/>`;
  if(y1>304){l+=`<rect x="${x0}" y="304" width="${w}" height="${y1-304}" fill="#dde6e7"/>`;
    for(let y=330;y<y1;y+=34)l+=`<rect x="${x0}" y="${y}" width="${w}" height="1.5" fill="#cbd6d8"/>`;
    for(let k=Math.floor(x0/68);k<=Math.ceil(x1/68);k++)l+=`<rect x="${k*68}" y="304" width="1.5" height="${y1-304}" fill="#cbd6d8"/>`}
  const sL=$('#wsL');sL.setAttribute('viewBox',vb);sL.setAttribute('preserveAspectRatio','none');sL.innerHTML=l;
  /* ruang periksa */
  let r=`<rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="#edf4f5"/>`+ceil('#fbfcfc')+lights(-26);
  for(let k=Math.floor(x0/60);k<=Math.ceil(x1/60);k++)r+=`<rect x="${k*60}" y="8" width="1.5" height="232" fill="#e1ebed"/>`;
  r+=`<rect x="${x0}" y="238" width="${w}" height="6" fill="#fafcfc"/><rect x="${x0}" y="244" width="${w}" height="56" fill="#cfe5e1"/><rect x="${x0}" y="298" width="${w}" height="8" fill="#8fb1ac"/>`;
  r+=`<rect x="${x0}" y="306" width="${w}" height="164" fill="#d3dee0"/>`;
  for(let y=334;y<470;y+=32)r+=`<rect x="${x0}" y="${y}" width="${w}" height="1.5" fill="#c3cfd2"/>`;
  for(let k=Math.floor(x0/64);k<=Math.ceil(x1/64);k++)r+=`<rect x="${k*64}" y="306" width="1.5" height="164" fill="#c3cfd2"/>`;
  r+=deskBand(x0,w,y1);
  const sR=$('#wsR');sR.setAttribute('viewBox',vb);sR.setAttribute('preserveAspectRatio','none');sR.innerHTML=r;
}
function setWorld(m){$('#wLobby').classList.toggle('on',m==='lobby');$('#wRoom').classList.toggle('on',m==='room')}
addEventListener('resize',()=>fit());
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe(app);
document.addEventListener('focusout',()=>setTimeout(()=>fit(true),350));

/* ================= AUDIO: BGM + efek (WebAudio, tanpa file) ================= */
const Snd=(()=>{
  let ctx=null,mus,musG,sfx,on=true,nextT=0,step=0,NB=null;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function tone(f,t,d,v,type='sine',dest,a=.008,to){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+a+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+a+d+.05)}
  function nz(t,d,v,type,freq,dest,q=.8){const s=ctx.createBufferSource();s.buffer=NB;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.003+d);s.connect(f);f.connect(g);g.connect(dest||sfx);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
  function ep(f,t,d,v){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='sine';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.003;g2.gain.value=.2;lp.type='lowpass';lp.frequency.value=2000;
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);lp.connect(mus);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(v*.4,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
  /* BGM santai: electric piano, bass lembut, perkusi ringan */
  const BPM=80,CH=[[48,[60,64,67,71]],[45,[57,60,64,67]],[41,[57,60,65,69]],[43,[55,59,62,65]]];
  const MEL=[-1,-1,79,-1,76,-1,74,72, -1,-1,72,-1,74,-1,-1,-1, -1,-1,77,-1,76,-1,74,72, -1,-1,71,-1,74,-1,-1,-1];
  function sched(){if(!ctx||ctx.state!=='running')return;const sp=60/BPM/2;
    if(nextT<ctx.currentTime-.2)nextT=ctx.currentTime+.05;
    while(nextT<ctx.currentTime+.15){const bar=Math.floor(step/8)%4,s=step%8,c=CH[bar],t=nextT+(s%2?sp*.12:0);
      if(s===0){c[1].forEach((n,k)=>ep(mtof(n),t+k*.01,2.4,.026));tone(mtof(c[0]),t,.6,.11,'triangle',mus,.006)}
      if(s===4)c[1].slice(1).forEach((n,k)=>ep(mtof(n),t+k*.008,1,.013));
      if(s===3)tone(mtof(c[0]+7),t,.35,.07,'triangle',mus,.006);
      if(s===0||s===5)tone(110,t,.15,.14,'sine',mus,.002,48);
      if(s===4)nz(t,.1,.035,'bandpass',2200,mus,.7);
      nz(t,.02,s%2?.008:.013,'highpass',8000,mus,.5);
      const m=MEL[step%32];if(m>0)tone(mtof(m),t,.55,.028,'triangle',mus,.012);
      nextT+=sp;step++}}
  function init(){if(ctx){ctx.resume&&ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();const comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
    musG=ctx.createGain();musG.gain.value=on?.55:0;musG.connect(comp);mus=ctx.createGain();mus.connect(musG);
    sfx=ctx.createGain();sfx.gain.value=.85;sfx.connect(comp);
    NB=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextT=ctx.currentTime+.1;setInterval(sched,30);ctx.resume&&ctx.resume();
    document.addEventListener('visibilitychange',()=>{if(document.hidden)ctx.suspend();else ctx.resume()})}
  const T=(f,d,o={})=>{if(!ctx)return;tone(f,ctx.currentTime+(o.t||0),d,o.v??.12,o.type||'sine',null,.008,o.to)};
  const S={click(){T(620,.06,{v:.07})},pop(){T(420,.1,{to:900,v:.1})},whoosh(){T(200,.4,{to:1300,v:.05,type:'triangle'})},
    good(){T(660,.13,{v:.1});T(880,.2,{v:.1,t:.1})},bad(){T(240,.25,{type:'triangle',v:.12,to:150})},
    scan(){T(1040,.07,{v:.07,type:'triangle'});T(1390,.09,{v:.06,type:'triangle',t:.08})},
    win(){[72,76,79,84].forEach((m,i)=>T(mtof(m),.32,{v:.09,t:i*.1,type:'triangle'}))},star(){T(1320,.14,{v:.08,type:'triangle'});T(1760,.18,{v:.07,t:.07,type:'triangle'})}};
  return{init,S,toggle(){on=!on;if(ctx)musG.gain.setTargetAtTime(on?.55:0,ctx.currentTime,.1);return on}};
})();
const snd=Snd.S;
$('#bgm').onclick=()=>{Snd.init();const on=Snd.toggle();$('#bgm').classList.toggle('off',!on);snd.click()};

/* ================= KARAKTER (SVG semi-realistis) ================= */
let UID=0;
function shade(h,p){const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p/100):v+(255-v)*p/100)));
  return'#'+[f(n>>16),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const OL='rgba(28,34,52,.3)';
const limb=(d,w,c)=>`<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w+1.8}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const ARM={R:{full:'M85 80 Q91 110 93 141',sh:'M85 80 Q88 92 89.5 102',lg:'M85 80 Q91 110 92.6 136',h:[93,146]},
  Ld:{full:'M35 80 Q29 110 27 141',sh:'M35 80 Q32 92 30.5 102',lg:'M35 80 Q29 110 27.4 136',h:[27,146]},
  Lb:{full:'M35 80 Q30 100 34 114 Q46 122 56 118',sh:'M35 80 Q32 92 32 102',lg:'M35 80 Q30 100 34 114 Q44 121 52 119',h:[59,117]},
  Lh:{full:'M35 80 Q22 77 22 63 Q25 47 39 39',sh:'M35 80 Q28 79 25 73',lg:'M35 80 Q22 77 22 63 Q24 51 33 43',h:[42,37]}};
const hand=(a,sk)=>`<circle cx="${a.h[0]}" cy="${a.h[1]}" r="5.7" fill="${sk}" stroke="${OL}" stroke-width="1"/><path d="M${a.h[0]-2.6} ${a.h[1]+2.4} q2.6 1.6 5.2 0" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="1"/>`;
const armPath=(a,sk,sl,longS)=>limb(a.full,10.5,sk)+limb(longS?a.lg:a.sh,longS?13:14.5,sl);
const ITEM={
  strip:`<g transform="rotate(-14 93 146)"><rect x="86.5" y="135" width="10.5" height="20" rx="1.6" fill="#dfe4ea" stroke="#8d99a6" stroke-width=".8"/>${[0,1,2].map(r=>[89.3,94.2].map(x=>`<circle cx="${x}" cy="${139.5+r*5}" r="1.6" fill="#fff" stroke="#b8c2cc" stroke-width=".6"/>`).join('')).join('')}</g>`,
  box:`<rect x="84.6" y="137" width="15" height="12" rx="1.3" fill="#fff" stroke="#8d99a6" stroke-width=".8"/><rect x="84.6" y="140.6" width="15" height="3.6" fill="#e5484d"/><path d="M92.1 145.4v2.6M90.8 146.7h2.6" stroke="#e5484d" stroke-width="1"/>`,
  bottle:`<rect x="88" y="134.4" width="10" height="15.6" rx="2.4" fill="#c27b2c" opacity=".93"/><rect x="88" y="131.2" width="10" height="4.4" rx="1.1" fill="#f6f6f6" stroke="#b8c2cc" stroke-width=".6"/><rect x="89.2" y="139" width="7.6" height="6.4" fill="#fff" opacity=".9"/><path d="M90.4 141h5M90.4 143h3.6" stroke="#c27b2c" stroke-width=".7"/>`,
  tissue:`<path d="M85.6 141 q3-6.4 7.4-3.2 q4.2-4 7.2 1 q3 4.2-1 7.2 q-4.2 4.2-8.2 1 q-6.4 1-5.4-6z" fill="#fff" stroke="#c9d1da" stroke-width=".8"/>`};
const BROW={neutral:['M48 34.6 Q52.5 33 57 34.4','M63 34.4 Q67.5 33 72 34.6'],happy:['M48 34 Q52.5 31.6 57 33.4','M63 33.4 Q67.5 31.6 72 34'],
  worry:['M48 35.2 Q52.5 34.4 56.6 31.6','M63.4 31.6 Q67.5 34.4 72 35.2'],sad:['M48 36 Q52.5 35.2 56.6 32','M63.4 32 Q67.5 35.2 72 36'],
  scared:['M48 32.2 Q52.5 29.2 57 31.4','M63 31.4 Q67.5 29.2 72 32.2']};
function eyes(m,skD){const big=m==='scared',ry=big?3:2.35;let s='';
  [52.5,67.5].forEach(x=>{s+=`<ellipse cx="${x}" cy="41" rx="3.7" ry="${ry}" fill="#fff"/><circle cx="${x}" cy="41.3" r="${big?1.7:2}" fill="#2a1d16"/><circle cx="${x+.75}" cy="40.4" r=".65" fill="#fff"/>
   <path d="M${x-3.9} 40.6 Q${x} ${41-ry-1.3} ${x+3.9} 40.6" fill="none" stroke="#2a1d16" stroke-width="1.15" stroke-linecap="round"/>`;
   if(m==='happy')s+=`<path d="M${x-3.2} 43.6 Q${x} 45.2 ${x+3.2} 43.6" fill="none" stroke="${skD}" stroke-width="1" stroke-linecap="round"/>`;
   if(m==='sad')s+=`<path d="M${x-3.9} ${x<60?39.6:38.2} L${x+3.9} ${x<60?38.2:39.6}" stroke="${skD}" stroke-width="2.2" stroke-linecap="round"/>`;});
  return s}

/* ================= RUANG PERIKSA ================= */
let phase='',found=[false,false,false],closed=false,curP=0,guideOn=false;
function ptSVG(P,m){const p={...P.p,m:m||P.p.m};
  const z1=P.zone1==='legs'?`<rect class="zn" data-z="1" x="36" y="142" width="48" height="84" rx="10"/>`:`<rect class="zn" data-z="1" x="31" y="70" width="58" height="66" rx="10"/>`;
  const z2=`<rect class="zn" data-z="2" x="80" y="124" width="28" height="42" rx="10"/>`+(p.pose==='down'||!p.pose?`<rect class="zn" data-z="2" x="12" y="124" width="28" height="42" rx="10"/>`:'');
  return person(p).replace('</svg>',`<rect class="zn" data-z="0" x="34" y="8" width="52" height="60" rx="12"/>${z1}${z2}</svg>`)}
function renderPt(m){const P=PTS[curP];$('#pt').innerHTML=ptSVG(P,m);found.forEach((f,i)=>{if(f)$$(`#pt .zn[data-z="${i}"]`).forEach(z=>z.classList.add('done'))})}
function buildRoom(i){const P=PTS[i];curP=i;closed=S.closedNext;S.closedNext=false;found=[false,false,false];
  const pt=$('#pt');pt.className='fig idle';renderPt(closed?'neutral':P.p.m);
  $('#cNo').textContent=`PASIEN ${i+1}/${PTS.length}`;$('#cName').textContent=P.name;$('#cRole').textContent=P.role;$('#cKel').innerHTML=`Keluhan: <b>${P.title}</b>`;
  $('#slots').innerHTML=P.z.map((z,k)=>`<button class="slot" data-z="${k}"><div class="sl"><i>${ZI[z[0]]||'🩺'}</i>${z[0]}<em>BELUM</em></div><p>Sentuh bagian ini atau tubuh pasien untuk memeriksa.</p></button>`).join('');
  $('#chart').classList.remove('nudge');
  $('#plate').textContent='dr. '+nameP;
  const order=['lk','ob','rs'].sort(()=>Math.random()-.5);
  $('#tray').innerHTML=order.map(k=>`<button class="tool" data-k="${k}">${ICON[k]}<b>${TOOLLB[k]}</b></button>`).join('');
  $('#trayHd').classList.remove('on');$('#tray').classList.remove('on');
}
function examine(i,ev){
  if(phase!=='choose')return;
  const P=PTS[curP],slot=$(`.slot[data-z="${i}"]`);
  if(ev&&ev.target.closest('#pt')){const box=$('#pt'),r=box.getBoundingClientRect(),sc=r.width/box.offsetWidth||1;const pg=document.createElement('i');pg.className='ping';pg.style.left=(ev.clientX-r.left)/sc+'px';pg.style.top=(ev.clientY-r.top)/sc+'px';box.appendChild(pg);setTimeout(()=>pg.remove(),700)}
  if(found[i])return;
  if(closed){slot.classList.add('shut');$('em',slot).textContent='DITOLAK';$('p',slot).textContent='🔒 Pasien menutup diri dan memilih tidak bercerita. Kepercayaannya sudah retak.';snd.bad();return}
  found[i]=true;snd.scan();slot.classList.add('found');$('em',slot).textContent='✓ DIPERIKSA';$('p',slot).innerHTML=fill(P.z[i][1]);
  $$(`#pt .zn[data-z="${i}"]`).forEach(z=>z.classList.add('done'));
  slot.animate([{background:'rgba(47,158,149,.28)'},{background:'transparent'}],{duration:900});
  if(found.every(Boolean)){toast('🩺 Pemeriksaan lengkap!','good');snd.good()}
  if(guideOn)guideStep();else{$('#chart').classList.remove('nudge');remindOff()}
}
$('#pt').addEventListener('click',e=>{const z=e.target.closest&&e.target.closest('.zn');if(z)examine(+z.dataset.z,e)});
$('#slots').addEventListener('click',e=>{const b=e.target.closest('.slot');if(b)examine(+b.dataset.z)});

/* Pemandu visual: hanya di pasien pertama */
function guideStep(){
  const k=found.findIndex(f=>!f);
  if(k>=0&&!closed){$('#pt').classList.add('guide');handAt($(`#pt .zn[data-z="${k}"]`),0,4);remind('👆 Sentuh <b>'+PTS[curP].z[k][0].toLowerCase()+'</b> pasien untuk memeriksanya')}
  else{$('#pt').classList.remove('guide');handAt($('#tray .tool:not(.x)'),0,0);remind('✅ Sekarang pilih tindakan yang paling tepat')}
}
function guideStop(){guideOn=false;$('#pt').classList.remove('guide');handOff();remindOff()}
function pickAction(first){return new Promise(res=>{
  phase='choose';$('#tray').classList.add('on');$('#trayHd').classList.add('on');
  $('#trayHd').textContent=first?'🧰 Pilih tindakan untuk pasien:':'🔁 Coba pilih tindakan lain:';
  if(curP===0){guideOn=true;guideStep()}
  else if(first&&!found.some(Boolean)){remind('🩺 Ingat, periksa pasien dulu sebelum memilih tindakan!',5200);$('#chart').classList.add('nudge')}
  $$('#tray .tool').forEach(b=>b.onclick=()=>{if(phase!=='choose')return;phase='';snd.click();guideStop();$('#chart').classList.remove('nudge');hideNotif();
    $('#tray').classList.remove('on');$('#trayHd').classList.remove('on');res(b.dataset.k)})})}

/* ================= SATU PASIEN ================= */
async function playPatient(i){const P=PTS[i];
  await cine('🩺',`${P.time} WIB`,'Poli Umum',`Pasien ${i+1} dari ${PTS.length}`,()=>{
    $('#denny').classList.add('hide');setWorld('room');setDecor('room');$('#roomUI').classList.remove('hide');buildRoom(i);$('#pt').classList.remove('hide');
    setPlace(`🕗 ${P.time} · Pasien ${i+1}/${PTS.length}`)});
  $('#pt').animate([{transform:'translateX(90px)',opacity:0},{transform:'none',opacity:1}],{duration:650,easing:'cubic-bezier(.22,1,.36,1)'});
  const pav=m=>head({...P.p,m});
  await dialog([{who:P.name,role:P.role,av:pav(closed?'neutral':P.p.m),t:closed?'Saya baik-baik saja kok, Dok. Nggak ada keluhan… cuma mampir.':P.say}],'Periksa');
  let tries=0,first=null;
  while(true){
    const act=await pickAction(tries===0);tries++;if(!first){first=act;
      S.streak=S.streak.c===act?{c:act,n:S.streak.n+1}:{c:act,n:1};habChip()}
    const ok=act===P.ans,pts=tries===1?20:15;
    const mood=ok?'happy':act==='rs'?'sad':'worry';
    await dialog([{...ME(),t:P.L[act]},{who:P.name,role:P.role,av:pav(mood),t:P.R[act],fn:()=>{
      renderPt(mood);$('#pt').className='fig '+(ok?'hop':'shake');
      if(ok){S.safe=Math.min(100,S.safe+pts);setTrust();hit('#trust');snd.good();
        toast(tries===1?'✅ Tepat di pilihan pertama!<br>😊 Kepuasan +20%':'✅ Tepat!<br>😊 Kepuasan +15%','good');
        const r=rectStage($('#trust'));floatText(r.x+r.w/2,r.y+r.h+8,'+'+pts+'%','#1f9e5a');
        $$('#tray .tool').forEach(b=>b.classList.toggle('ok',b.dataset.k===act));
        notif('<b>Tepat!</b> '+MEAN[act].ok[0].replace(/^[^:]*: ?/,'').replace(/^./,c=>c.toUpperCase())+'.','good')}
      else{snd.bad();$(`#tray .tool[data-k="${act}"]`).classList.add('x');
        toast('⚠️ Kurang tepat<br><small>Pilih tindakan lainnya yang tepat</small>','mid');
        notif(`<b>${MEAN[act].no[0]}.</b> Cek lagi rekam medisnya, lalu pilih tindakan lain.`,'bad')}}}],ok?'Lanjut':'Pilih lagi');
    if(ok){S.hist.push({i,first,tries,pts,nf:found.filter(Boolean).length,closed});break}
    renderPt(P.p.m);$('#pt').className='fig idle';
  }
  hideNotif();$('#pt').className='fig idle';
  const fx=S.streak.n>=3&&i<PTS.length-1;
  if(fx){S.closedNext=true;await modal('⚠️','Efek Kebiasaan: '+EFXM[S.streak.c][0],EFXM[S.streak.c][1],'Pasien berikutnya menutup diri');S.streak={c:null,n:0};habChip()}
}

  inp.oninput=chk;inp.onkeydown=e=>{if(e.key==='Enter'&&!go.disabled){e.preventDefault();go.click()}};
  go.onclick=async()=>{nameP=inp.value.trim().replace(/\s+/g,' ').slice(0,18);inp.blur();Snd.init();snd.win();
    await c.animate([{opacity:1},{opacity:0,transform:'translateY(-46%) scale(.95)'}],{duration:280,fill:'forwards'}).finished;c.remove();fit(true);res()};
})}
function howTo(){return new Promise(res=>{
  app.classList.add('dim');
  const c=document.createElement('div');c.className='card gCard';
  c.innerHTML=`<h2>📋 Instruksi Permainan</h2>
    <div class="steps">
     <div><span class="n">👂</span><div><b>Dengarkan keluhan pasien</b></div></div>
     <div><span class="n">🩺</span><div><b>Periksa pasien</b></div></div>
     <div><span class="n">🧰</span><div><b>Pilih tindakan untuk pasien</b></div></div>
    </div>
    <button class="btn orange wide" id="go2">Siap, buka praktik ▶</button>`;
  $('#ui').appendChild(c);
  c.animate([{opacity:0,transform:'translateY(-40%) scale(.94)'},{opacity:1,transform:'translateY(-50%)'}],{duration:550,easing:'cubic-bezier(.34,1.56,.64,1)'});
  $('#go2').onclick=async()=>{snd.click();app.classList.remove('dim');await c.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).finished;c.remove();res()};
})}

/* ================= EVALUASI & DEBRIEFING ================= */
let dI=0;
function reflect(){dI=0;app.classList.add('dim');const w=document.createElement('div');w.id='rwrap';$('#ui').appendChild(w);card()}
function card(){const N=S.hist.length+1;if(dI>=N){$('#rwrap').remove();return final()}let c,fl=false;
  if(dI===0)c=`<div class="face"><span class="k">Evaluasi</span><h3>Pasien tadi ibarat anggota tim kamu.</h3>
     <div class="prow">${PTS.map(P=>`<span>${head({...P.p,m:'happy'})}</span>`).join('')}</div>
     <div class="vid">🧑‍⚕️ Dokter = Kamu sebagai atasan<br>🧍 Pasien = Anggota tim yang bawa kabar<br>🩺 Periksa dulu = Tanya fakta sebelum bereaksi</div>
     <p>Ingat, tindakan yang tepat didasari oleh fakta. Jadi, cari tahu dulu faktanya ya.</p><button class="btn orange" id="dn">Mulai evaluasi ▶</button></div>`;
  else{fl=true;const h=S.hist[dI-1],P=PTS[h.i],A=ACT[h.first],M=MEAN[P.ans].ok;
    c=`<div class="face"><span class="k">Pasien ${h.i+1} dari ${PTS.length}</span><div class="pfig">${person({...P.p,m:'happy'},'14 4 92 134')}</div><h3>${P.name}: ${P.title}</h3>
      <p>Pilihan pertamamu: <b>${A.ic} ${A.lb}</b></p>
      <span class="res ${h.tries===1?'a':'b'}">${h.tries===1?'✅ Langsung tepat · +20%':'🔁 Tepat setelah pilih lagi · +15%'}</span>
      <span class="tap">👆 Sentuh kartu untuk lihat maknanya</span></div>
     <div class="face back"><span class="k">Maknanya</span><h3>${M[0]}</h3><div class="vid">🧍 ${P.rep}</div>${M[1]?`<p>${M[1]}</p>`:''}
      ${h.tries>1?`<p class="wr">⚠️ <b>${MEAN[h.first].no[0]}.</b> ${MEAN[h.first].no[1]}</p>`:''}</div>`}
  $('#rwrap').innerHTML=`<div class="flip" id="fl"><div class="fc">${c}</div></div><div class="rnav"><div class="dots">${Array.from({length:N},(_,i)=>`<i class="${i<dI?'ok':i===dI?'on':''}"></i>`).join('')}</div><button class="btn" id="nx" ${fl?'disabled':'style="visibility:hidden"'}>${dI===N-1?'Lanjut':'Berikutnya'} ▶</button></div>`;
  $('#fl').animate([{opacity:0,transform:'translateY(30px) scale(.96)'},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.34,1.56,.64,1)'});
  const f=$('#fl');if(fl)f.onclick=()=>{snd.pop();f.classList.toggle('flipped');$('#nx').disabled=false};
  $('#nx').onclick=e=>{e.stopPropagation();snd.click();dI++;card()};if($('#dn'))$('#dn').onclick=e=>{e.stopPropagation();snd.click();dI++;card()}}

function final(){
  app.classList.remove('dim');
  const d=$('#denny');d.innerHTML=person(DOC);d.style.cssText='left:6px;top:46px;width:100px;height:200px';d.classList.remove('hide');
  d.animate([{transform:'translateX(-40px)',opacity:0},{transform:'none',opacity:1}],{duration:550,easing:'cubic-bezier(.22,1,.36,1)'});
  const b=document.createElement('div');b.className='dBub';
  b.innerHTML=`Nah, gitu deh, ${esc(salam)} <b>${esc(nameP)}</b>! 😄<br>Pasien tadi ibarat anggota tim yang bawa kabar laporan.`;
  $('#ui').appendChild(b);b.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'none'}],{duration:450,delay:250,fill:'backwards',easing:'cubic-bezier(.34,1.56,.64,1)'});
  const c=document.createElement('div');c.className='card dCard';
  c.innerHTML=`<ul>
    <li><i>📣</i><span>Kabar buruk <b>tetap harus tersampaikan/b>. Fokus kita beresin masalah dan cari faktanya, bukan nyerang yang lapor.</span></li>
    <li><i>🙈</i><span>Kalau tiap lapor kena omel, tim bakal nyembunyiin laporan yang jelek. Itu budaya <b>ABS</b> (Asal Bapak/Ibu Senang), kita jadi nggak tahu kondisi lapangan.</span></li>
    <li><i>⏸️</i><span>Biar nggak kepancing: <b>Tarik napas, kasih jeda 3 detik</b>, terus tanya: Apa faktanya, apa yang harus dicapai & dijaga, dan respons apa yang paling tepat.</span></li>
    <li><i>💪</i><span><b>Tegas tetap boleh</b>, asal yang disasar masalahnya, bukan orangnya.</span></li></ul>
    <div class="ask">Jadi, ${esc(salam)} ${esc(nameP)}, jangan lupa buat dipraktekin ya.</div>
    <button class="btn orange wide" id="siap">💪 Ulangi gamifikasi</button>`;
  $('#ui').appendChild(c);c.animate([{opacity:0,transform:'translateY(40px) scale(.95)'},{opacity:1,transform:'none'}],{duration:550,delay:150,fill:'backwards',easing:'cubic-bezier(.34,1.56,.64,1)'});
  $('#siap').onclick=()=>{snd.click();location.reload()};
  try{
    window.parent.postMessage("scoreBarFound", "*");
    window.top.postMessage("scoreBarFound", "*");
  }catch(e){}
}

/* ================= ALUR UTAMA ================= */
async function main(){
  setWorld('lobby');setDecor('lobby');
  await startScreen();
  const d=$('#denny');d.innerHTML=person(DOC);d.classList.remove('hide');
  d.animate([{transform:'translateY(40px)',opacity:0},{transform:'none',opacity:1}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
  await wait(350);
  await dialog([
    {...FER,t:`Halo, ${salam} <b>${esc(nameP)}</b>! Saya dr. Denny, Kepala Klinik Sehat Sentosa. Hari ini ${salam} <b>${esc(nameP)}</b> bertugas sebagai dokter jaga di Poli Umum ya.`},
    {...FER,t:`Akan ada <b>5 pasien</b> dengan keluhan yang terdengar umum. Pilih tindakan yang paling tepat: <b>Pemeriksaan Lanjutan, Resepkan Obat, atau Cukup Istirahat</b>.`},
    {...FER,t:`Keluhan yang sama bisa punya penyebab berbeda, dan pasien kadang <b>nggak menceritakan semuanya</b>. 😉 <br>Targetnya: Kepuasan pasien <b>100%</b>!`}],'Lanjut');
  await howTo();
  hud(true);setTrust();
  for(let i=0;i<PTS.length;i++)await playPatient(i);
  $('#hab').classList.add('hide');
  await cine('🌙','Akhir shift','Ruang Evaluasi','Waktunya evaluasi',()=>{hud(false);$('#roomUI').classList.add('hide');$('#pt').classList.add('hide');setWorld('lobby');setDecor('lobby')});
  reflect();
}
fit(true);
main().catch(e=>console.error(e));
})();
</script>
