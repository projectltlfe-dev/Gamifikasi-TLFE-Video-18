<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dokter Jaga: Simulasi RS Sehat Sentosa</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#22314d;--muted:#5d6b85;--teal:#2f8f83;--teal-d:#1f6f6a;--orange:#e07b3c;--red:#e5484d;--good:#1f9e5a;--disp:'Baloo 2',Nunito,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#cfeee9,#e8f4f2);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#bd{position:fixed;inset:0;z-index:0}#bd svg{position:absolute;left:-14px;top:-14px;width:calc(100% + 28px);height:calc(100% + 28px);filter:blur(5px)}#bd::after{content:"";position:absolute;inset:0;background:rgba(20,50,50,.35)}
#app{position:absolute;left:50%;top:0;width:100%;height:600px;transform-origin:top center;overflow:hidden;z-index:1;background:#e4f5f2;box-shadow:0 10px 40px rgba(31,111,106,.35)}
.hide{display:none!important}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;overflow:hidden}.scene.active{opacity:1;visibility:visible}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* HUD */
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:50;pointer-events:none;gap:6px}
#hr{display:flex;gap:6px;align-items:center;pointer-events:auto}
.chip{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;gap:6px;align-items:center;white-space:nowrap;color:var(--ink);border:0}
.chip.hit{animation:hit .5s}.chip.warn{background:#ffe3e3;animation:warn .8s infinite}
@keyframes hit{30%{transform:scale(1.18)}}@keyframes warn{50%{box-shadow:0 0 0 4px rgba(229,72,77,.55)}}
.mb{display:inline-block;width:46px;height:8px;border-radius:5px;background:#dfe6ee;overflow:hidden}.mb b{display:block;height:100%;transition:width .6s,background .3s}
.chip u{display:inline-block;width:9px;height:9px;border-radius:50%;background:#dfe6ee;text-decoration:none}.chip u.on{background:var(--orange)}.chip.warn u.on{background:var(--red)}
/* tombol */
.btn{font-family:var(--disp);font-weight:800;font-size:17px;border:none;border-radius:16px;padding:10px 22px;color:#fff;background:linear-gradient(180deg,#3fb5a6,#2a8f83);box-shadow:0 5px 0 #1d6b62,0 8px 18px rgba(31,111,106,.3);transition:transform .1s,box-shadow .1s;line-height:1.1}
.btn.orange{background:linear-gradient(180deg,#f0954f,#d86f2c);box-shadow:0 5px 0 #a8531c,0 8px 18px rgba(224,123,60,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d6b62}.btn:disabled{opacity:.5}
.btn.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.07)}}
/* start */
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(93%,430px);background:rgba(255,255,255,.96);border-radius:26px;padding:16px 20px;text-align:center;box-shadow:0 18px 40px rgba(31,111,106,.28);z-index:5;max-height:96%;overflow:auto}
.card h1{font-family:var(--disp);font-size:34px;line-height:1;color:var(--teal-d)}.card h1 span{color:var(--orange);display:block;font-size:26px}
.card .sub{color:var(--muted);font-weight:700;font-size:14px;margin:5px 0 8px}.lbl{font-weight:900;font-size:14px;margin-bottom:6px}
.chars{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.cc{width:110px;background:#f1f8f7;border:3px solid transparent;border-radius:18px;padding:4px;font-weight:900;color:var(--ink);display:flex;flex-direction:column;align-items:center}.cc svg{width:70px;height:70px}.cc.sel{border-color:var(--teal);background:#dff3ef}
#nameIn{width:100%;border:3px solid #cfe0dd;border-radius:14px;padding:9px 12px;font:800 17px Nunito;text-align:center;margin-bottom:10px;color:var(--ink);user-select:text;-webkit-user-select:text}
/* story box */
.story{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(94%,560px);background:rgba(255,255,255,.97);border-radius:22px;padding:12px 16px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:none;flex-direction:column;gap:8px;align-items:center;text-align:center;z-index:30}.story.on{display:flex}
.spk{display:flex;gap:8px;align-items:center}.av{width:38px;height:38px;border-radius:50%;background:#dff3ef;border:2px solid var(--teal);overflow:hidden;display:block}.av svg{width:100%;height:100%;display:block}
.who{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--teal-d)}
.story p{font-weight:800;font-size:17px;line-height:1.3}.story p.fade{animation:fd .4s}@keyframes fd{from{opacity:0;transform:translateY(5px)}}
/* ruang */
#pt{position:absolute;left:50%;bottom:86px;height:420px;aspect-ratio:100/156;transform:translateX(-50%);z-index:2}#pt svg{width:100%;height:100%;display:block;overflow:visible}
#pt.idle svg{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
#pt.shake svg{animation:shk .5s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#pt.hop svg{animation:hop .6s}@keyframes hop{40%{transform:translateY(-14px)}}
.zn{fill:transparent;cursor:pointer}.zn:hover{fill:rgba(255,255,255,.22)}
.ping{position:absolute;width:36px;height:36px;margin:-18px;border-radius:50%;border:4px solid #2f9e95;animation:ping .7s ease-out forwards;pointer-events:none}@keyframes ping{to{transform:scale(2.4);opacity:0}}
#desk{position:absolute;left:0;right:0;bottom:0;height:132px;z-index:4;background:linear-gradient(#c99564,#a8774a);border-top:6px solid #e0b98a;box-shadow:0 -8px 20px rgba(0,0,0,.15)}
#plate{position:absolute;left:12px;top:10px;background:#fff;border-radius:6px;padding:3px 10px;font:800 11px Nunito;color:var(--teal-d);box-shadow:0 2px 4px rgba(0,0,0,.2)}
#tray{position:absolute;inset:14px 24px 22px;display:flex;gap:12px;justify-content:center;align-items:stretch;opacity:0;pointer-events:none;transition:opacity .3s}#tray.on{opacity:1;pointer-events:auto}
.tool{flex:1;max-width:200px;background:#fffdf7;border:0;border-radius:18px;box-shadow:0 5px 0 #8a5d35,0 8px 14px rgba(0,0,0,.2);font-family:var(--disp);font-weight:800;font-size:15px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s;line-height:1.05}
.tool i{font-style:normal;font-size:34px}.tool:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5d35}
.tool.rc{background:#d7f7e8;animation:glw 1s 3}@keyframes glw{50%{box-shadow:0 5px 0 #8a5d35,0 0 0 6px #5fd68c}}
#ptag{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:14px;padding:4px 14px;font-weight:900;font-size:13px;z-index:6;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.12)}
#coach{position:absolute;top:84px;left:10px;width:min(30%,220px);background:rgba(255,255,255,.95);border-radius:14px;padding:8px 10px;font-weight:800;font-size:12.5px;z-index:16;box-shadow:0 6px 16px rgba(0,0,0,.22);display:none}#coach.on{display:block}
#syms{position:absolute;top:46px;right:10px;width:min(34%,250px);display:flex;flex-direction:column;gap:6px;z-index:16}
.sym{background:rgba(255,255,255,.96);border-left:5px solid var(--teal);border-radius:12px;padding:6px 9px;font-weight:700;font-size:12.5px;line-height:1.22;box-shadow:0 5px 14px rgba(0,0,0,.2);animation:fd .4s}.sym b{color:var(--teal-d);font-family:var(--disp)}.sym.shut{border-color:var(--red);background:#fff0f0}
#notif{position:absolute;top:46px;left:10px;width:min(40%,290px);background:#fff;border-radius:16px;padding:8px 11px;display:none;gap:8px;z-index:40;box-shadow:0 10px 24px rgba(0,0,0,.28);font-weight:700;font-size:13px;line-height:1.25}#notif.on{display:flex;animation:sl .4s}@keyframes sl{from{opacity:0;transform:translateY(-14px)}}
#notif small{display:block;font-size:11px;color:var(--muted);font-weight:900}
.toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) scale(.85);background:#fff;padding:10px 18px;border-radius:16px;font-weight:900;font-size:16px;opacity:0;transition:.25s;z-index:45;box-shadow:0 10px 26px rgba(0,0,0,.3);pointer-events:none;text-align:center;max-width:84%}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast.good{color:var(--good)}.toast.bad{color:var(--red)}
/* modal & cine */
#modal{position:absolute;inset:0;z-index:60;background:rgba(15,30,40,.6);display:none;place-items:center;padding:16px}#modal.on{display:grid}
.mcard{width:min(100%,380px);background:#fff;border-radius:24px;padding:18px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.4);animation:pop .4s}.mcard .ic{font-size:44px}.mcard h3{font-family:var(--disp);font-size:24px;color:var(--red);margin:2px 0 4px}.mcard p{font-weight:700;line-height:1.3;margin-bottom:6px;font-size:15px}
.pen{display:inline-block;background:#ffe3e3;color:var(--red);font-weight:900;border-radius:99px;padding:2px 12px;margin-bottom:10px;font-size:13px}
#cine{position:absolute;inset:0;z-index:58;background:linear-gradient(160deg,#173d42,#0e2328);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .45s;text-align:center;color:#fff}#cine.on{opacity:1}
#cine small{display:block;font-weight:900;letter-spacing:.14em;color:#8fd8cd;font-size:14px}#cine b{display:block;font-family:var(--disp);font-size:38px;line-height:1.05;margin:4px 0}#cine span{font-weight:700;color:#cfe3e1}
/* kilas balik */
.fbt{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,240,210,.12) 35%,rgba(110,70,25,.4));z-index:3}
#rwrap{position:absolute;inset:50px 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
.flip{width:min(100%,520px);height:370px;perspective:1200px;cursor:pointer}.fc{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}.flip.flipped .fc{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:24px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:0 18px 40px rgba(0,0,0,.28);overflow:hidden}.face.back{transform:rotateY(180deg);background:#fffbe8}
.k{font-weight:900;font-size:12px;background:#dff3ef;color:var(--teal-d);border-radius:99px;padding:2px 12px}
.face h3{font-family:var(--disp);font-size:23px;line-height:1.05}.face p{font-weight:700;font-size:15.5px;line-height:1.28;color:#3b4660}
.vid{background:#e9f1ff;border:2px dashed #7aa0d8;border-radius:12px;padding:5px 9px;font-weight:700;font-size:14.5px;line-height:1.25}
.ill{width:100px;height:100px;background:#dff3ef;border-radius:50%;overflow:hidden}.ill svg{width:100%;height:100%}.tap{font-size:12.5px;font-weight:800;color:var(--orange)}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(100%,520px);margin-top:10px}.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#fff;opacity:.5}.dots i.on{opacity:1;background:var(--orange)}.dots i.ok{opacity:1;background:#5fd68c}
/* final */
.fcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-47%);width:min(94%,500px);max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:26px;padding:14px 18px;text-align:center;box-shadow:0 18px 40px rgba(31,111,106,.3);z-index:3}
.fcard h2{font-family:var(--disp);font-size:28px;color:var(--teal-d)}.stars{display:flex;justify-content:center;gap:6px;font-size:32px}.stars span{filter:grayscale(1);opacity:.3;transition:.4s}.stars span.on{filter:none;opacity:1;transform:scale(1.15)}
.ending{display:inline-block;font-weight:900;font-size:13px;padding:4px 12px;border-radius:12px;margin:4px 0}.ending.good{background:#d7f7e8;color:#157a45}.ending.mid{background:#fff0bd;color:#8a6200}.ending.bad{background:#ffe3e3;color:#b02a2f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.st{background:#f1f8f7;border-radius:12px;padding:5px 2px}.st b{display:block;font-family:var(--disp);font-size:22px}.st span{font-size:11.5px;font-weight:800}
.fcard p{font-weight:700;font-size:14.5px;line-height:1.3;margin-bottom:8px;color:#3b4660}
.confetti{position:absolute;top:-10px;width:8px;height:12px;animation:fall linear forwards;z-index:70}@keyframes fall{to{transform:translateY(620px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="bd"></div>
<div id="app">
  <div id="hud"><div class="chip hide" id="place"></div><div id="hr"><div class="chip hide" id="trust"></div><div class="chip hide" id="hab"></div><button class="chip" id="bgm" aria-label="Suara">🔊</button></div></div>

  <section class="scene active" id="sc-start"><div class="card">
    <h1>Dokter Jaga <span>RS Sehat Sentosa</span></h1><p class="sub">Satu shift, lima pasien, banyak keputusan kecil.</p>
    <div class="lbl">Kamu mau dipanggil apa?</div>
    <div class="chars"><button class="cc" data-s="Bapak" id="cM"><span></span><span>Bapak</span></button><button class="cc" data-s="Ibu" id="cF"><span></span><span>Ibu</span></button></div>
    <input id="nameIn" maxlength="20" placeholder="Tulis namamu di sini" autocomplete="off" aria-label="Nama">
    <button class="btn orange" id="btnStart" disabled>Mulai Shift Jaga ▶</button></div></section>

  <section class="scene" id="sc-open"><div id="openFerdi" style="position:absolute;left:50%;bottom:150px;height:340px;aspect-ratio:100/156;transform:translateX(-50%)"></div></section>

  <section class="scene" id="sc-room">
    <div id="roomBg"></div><div id="ptag"></div><div id="pt" class="idle"></div>
    <div id="coach">💡 Pilih tindakan di meja dokter.</div><div id="syms"></div>
    <div id="desk"><div id="plate"></div><div id="tray"></div></div>
  </section>

  <section class="scene" id="sc-reflect"><div class="fbt"></div><div id="rwrap"></div></section>

  <section class="scene" id="sc-final"><div class="fcard">
    <div style="width:84px;height:84px;margin:0 auto" id="fAv"></div><h2 id="fT"></h2><div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="ending" id="fEnd"></div><div class="stats" id="fSt"></div><p id="fTx"></p>
    <button class="btn orange" onclick="location.reload()">↻ Main Lagi</button></div></section>

  <div class="story" id="story"><div class="spk"><span class="av" id="sAv"></span><span class="who" id="sWho"></span></div><p id="sTxt"></p><button class="btn orange hide" id="sBtn"></button></div>
  <div id="notif"><span class="av" id="nAv" style="flex:none"></span><div><small>dr. Ferdi · sekarang</small><span id="nTx"></span></div></div>
  <div class="toast" id="toast"></div>
  <div id="modal"><div class="mcard"><div class="ic" id="mIc"></div><h3 id="mT"></h3><p id="mP"></p><div class="pen" id="mPen"></div><br><button class="btn orange" id="mBtn">Lanjut ▶</button></div></div>
  <div id="cine"><div><small id="cT"></small><b id="cP"></b><span id="cS"></span></div></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const INK='#22314d',REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let salam='',nameP='',audioOn=true,actx=null;
const fill=s=>String(s).replace(/\{s\}/g,salam).replace(/\{n\}/g,esc(nameP));

/* ===== Suara ===== */
function sfx(f,d=.12,t='sine',to){if(!audioOn)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(n+d)}catch(e){}}
const snd={click:()=>sfx(520,.08),whoosh:()=>sfx(200,.5,'sawtooth',900),good:()=>{sfx(660,.15);setTimeout(()=>sfx(880,.2),120)},bad:()=>sfx(180,.35,'sawtooth',90),pop:()=>sfx(760,.1)};
$('#bgm').onclick=()=>{audioOn=!audioOn;$('#bgm').textContent=audioOn?'🔊':'🔇'};

/* ===== Karakter ===== */
const MOUTH={sad:'M43 48Q50 42 57 48',worry:'M43 47Q46 43 50 47T57 47',neutral:'M44 46H56',happy:'M43 43Q50 52 57 43',scared:'M44 47Q50 41 56 47'};
function person(o={},att='viewBox="0 0 100 156"'){const{sk='#f1c9a0',hr='#2b1d14',sh='#3d7fd9',m='neutral',coat=0,gl=0,fem=0}=o,body=coat?'#fff':sh;
  let s=`<svg ${att} aria-hidden="true"><g stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">`;
  s+=`<rect x="36" y="118" width="11" height="34" rx="4" fill="#3a4050"/><rect x="53" y="118" width="11" height="34" rx="4" fill="#3a4050"/>`;
  if(fem)s+=`<rect x="26" y="20" width="48" height="52" rx="20" fill="${hr}"/>`;
  s+=`<rect x="17" y="64" width="14" height="48" rx="7" fill="${body}"/><rect x="69" y="64" width="14" height="48" rx="7" fill="${body}"/><rect x="31" y="58" width="38" height="64" rx="12" fill="${body}"/><circle cx="24" cy="114" r="6" fill="${sk}"/><circle cx="76" cy="114" r="6" fill="${sk}"/>`;
  if(coat)s+=`<path d="M42 62Q42 92 50 92Q58 92 58 62" fill="none" stroke="#5b6275" stroke-width="3"/><circle cx="50" cy="95" r="4" fill="#9aa0aa"/><path d="M44 60L50 76L56 60Z" fill="#2f9e95"/>`;
  s+=`<circle cx="50" cy="36" r="21" fill="${sk}"/><path d="M29 34Q28 12 50 13Q72 12 71 34Q62 24 50 25Q38 24 29 34Z" fill="${hr}"/><circle cx="43" cy="37" r="2" fill="${INK}" stroke="none"/><circle cx="57" cy="37" r="2" fill="${INK}" stroke="none"/>`;
  if(gl)s+=`<circle cx="43" cy="37" r="6.5" fill="none"/><circle cx="57" cy="37" r="6.5" fill="none"/>`;
  if(m==='scared')s+=`<path d="M38 29L46 31M62 29L54 31" fill="none"/>`;
  s+=`<path d="${MOUTH[m]||MOUTH.neutral}" fill="none"/>`;
  if(m==='worry'||m==='scared')s+=`<path d="M70 26q-4 6 0 7q4-1 0-7" fill="#6fbdf0" stroke="none"/>`;
  if(m==='sad')s+=`<circle cx="40" cy="44" r="2.2" fill="#6fbdf0" stroke="none"/>`;
  return s+`</g></svg>`}
const head=o=>person(o,'viewBox="27 10 46 46"');
const DOC={coat:1,gl:1,sk:'#e8b98a',hr:'#8a909c',m:'happy'};
const myP=()=>({coat:1,sk:'#f1c9a0',hr:'#2b1d14',fem:salam==='Ibu'?1:0,m:'happy'});
const ME=()=>({who:'Dokter '+salam+' '+nameP,av:head(myP())});
const FER={who:'dr. Ferdi · Kepala RS',av:head(DOC)};
const ptZones=`<rect class="zn" data-z="0" x="28" y="10" width="44" height="50"/><rect class="zn" data-z="1" x="30" y="60" width="40" height="60"/><rect class="zn" data-z="2" x="12" y="62" width="19" height="58"/><rect class="zn" data-z="2" x="69" y="62" width="19" height="58"/>`;
const ptSVG=p=>person(p).replace('</svg>',ptZones+'</svg>');

/* ===== Latar ===== */
function hallSVG(){const R=(x,y,w,h,f,r=3)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"/>`,T=(x,y,t,z=10,c='#fff')=>`<text x="${x}" y="${y}" font-size="${z}" fill="${c}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800">${t}</text>`;
  let fl='';for(let i=-4;i<=8;i++)fl+=`<path d="M200 190L${i*60-20} 300" stroke="rgba(34,49,77,.12)" stroke-width="1.5"/>`;[206,224,250,285].forEach(y=>fl+=`<path d="M0 ${y}H400" stroke="rgba(34,49,77,.12)" stroke-width="1.5"/>`);

  if(ex){$('#notif').classList.remove('on');await modal('⚠️','Efek Kebiasaan: '+EFXM[cat][0],EFXM[cat][1],ex)}
}

/* ===== Alur utama ===== */
async function run(){
  $('#hud').style.display='';showScene('sc-open');$('#sc-open').insertAdjacentHTML('afterbegin',hallSVG());$('#openFerdi').innerHTML=person(DOC);
  await dialog([{...FER,t:`Selamat pagi, Dokter ${salam} <b>${esc(nameP)}</b>! Saya dr. Ferdi, Kepala RS Sehat Sentosa. Hari ini kamu dokter jaga.`},
    {...FER,t:`Akan ada <b>5 pasien</b> datang bergantian. Pilih tindakan yang paling <b>kamu banget, secara spontan ya</b>!`},
    {...FER,t:`Satu pesan: pasien kadang <b>nggak cerita semuanya</b>. Kalau penasaran, kamu bisa memeriksanya sendiri. 😉<br>Targetnya: bikin <b>kepercayaan pasien</b> naik!`}],'Mulai Visit');
  chips();
  for(let i=0;i<PTS.length;i++)await playPatient(i);
  $('#trust').classList.add('hide');$('#hab').classList.add('hide');
  await cine('Akhir shift','Ruang Dokter','Waktunya evaluasi',()=>{setPlace('');showScene('sc-reflect');$('#sc-reflect').insertAdjacentHTML('afterbegin',hallSVG());reflect()});
}

/* ===== Kilas balik ===== */
const CLOSING='Rasa aman tim dibangun dari cara kita merespons kabar buruk. Kalau pelapor yang diserang, tim akan belajar menyaring laporan, dan kondisi lapangan yang sebenarnya jadi tidak ketahuan. Fokus ke <b>masalahnya</b>. Tegas tetap boleh, asal bukan menyerang <b>orangnya</b>.';
let dI=0;function reflect(){dI=0;card()}
function card(){const N=S.hist.length+2;if(dI>=N)return final();let c,fl=false;
  if(dI===0)c=`<div class="face"><span class="k">Plot twist 🎬</span><h3>Pasienmu sebenarnya adalah anggota tim.</h3><div class="vid" style="text-align:left">🧑‍⚕️ Dokter = kamu sebagai atasan<br>🧍 Pasien = anggota tim yang membawa kabar buruk<br>🗣️ Keluhan = laporan masalah di pekerjaan<br>🔪 Operasi = respons keras, menyerang orangnya<br>💊 Obat = respons positif, fokus ke masalah<br>🛏️ Istirahat = respons acuh, laporan diabaikan<br>🩺 Memeriksa pasien = bertanya dulu sebelum bereaksi</div><p>Yuk, lihat arti keputusanmu satu per satu.</p><button class="btn orange" id="dn">Mulai kilas balik ▶</button></div>`;
  else if(dI<=S.hist.length){fl=true;const h=S.hist[dI-1],P=PTS[h.i],A=ACT[h.act];
    c=`<div class="face"><span class="k">Kilas balik · Pasien ${h.i+1}</span><div class="ill">${head({...P.p,m:h.act==='rc'||h.act==='ob'?'happy':P.p.m})}</div><h3>${P.name}: ${P.title}</h3><p>Keputusanmu: <b>${A.ic} ${A.lb}</b></p><span class="tap">Ketuk kartu untuk melihat maknanya</span></div>
    <div class="face back"><span class="k">Maknanya</span><h3>${A.mt}</h3><div class="vid">🧍 ${P.rep}</div><p>${A.mp}</p><span class="tap">🩺 Bagian yang kamu periksa: ${h.nf}/3 (tiap bagian = satu pertanyaan sebelum bereaksi)</span></div>`}
  else c=`<div class="face"><span class="k">Inti Cerita</span><h3>Kabar buruk tetap harus naik.</h3><p>Fokus leader: <b>tangani masalah dan dapatkan fakta</b>, bukan menyerang orang yang membawa laporan.</p><div class="vid" style="text-align:left">Jeda 3 detik, lalu tanya:<br>1️⃣ Apa faktanya?<br>2️⃣ Apa yang harus dicapai dan tetap dijaga?<br>3️⃣ Apa respons paling tepat sekarang?</div><button class="btn orange" id="dn">Lihat hasil ▶</button></div>`;
  $('#rwrap').innerHTML=`<div class="flip" id="fl"><div class="fc">${c}</div></div><div class="rnav"><div class="dots">${Array.from({length:N},(_,i)=>`<i class="${i<dI?'ok':i===dI?'on':''}"></i>`).join('')}</div><button class="btn" id="nx" ${fl?'disabled':'style="display:none"'}>Berikutnya ▶</button></div>`;
  const f=$('#fl');if(fl)f.onclick=()=>{snd.pop();f.classList.toggle('flipped');$('#nx').disabled=false};
  $('#nx').onclick=e=>{e.stopPropagation();snd.click();dI++;card()};if($('#dn'))$('#dn').onclick=e=>{e.stopPropagation();snd.click();dI++;card()}}

/* ===== Hasil akhir ===== */
function final(){showScene('sc-final');const cnt=k=>S.hist.filter(h=>h.act===k).length,sf=S.safe,st=sf>=80?3:sf>=50?2:1;
  $('#fAv').innerHTML=head(myP());$('#fT').textContent=`Selamat, ${salam} ${nameP}!`;
  const e=$('#fEnd');e.className='ending '+(sf>=80?'good':sf>=50?'mid':'bad');e.textContent=sf>=80?'Ending: Dokter Panutan':sf>=50?'Ending: Dokter Berkembang':'Ending: Dokter Perlu Latihan';
  $('#fSt').innerHTML=`<div class="st"><b>${cnt('op')}</b><span>🔪 Operasi</span></div><div class="st"><b>${cnt('rs')}</b><span>🛏️ Istirahat</span></div><div class="st"><b>${cnt('ob')}</b><span>💊 Obat</span></div><div class="st"><b>${cnt('rc')}</b><span>🧪 Racikan</span></div>`;
  $('#fTx').innerHTML=`🤝 Nilai akhir (kepercayaan pasien = rasa aman tim): <b>${sf}</b> / 100.<br>${CLOSING}`;
  $$('#stars span').forEach((s,i)=>{if(i<st)setTimeout(()=>{s.classList.add('on');snd.pop()},400+i*350)});
  if(st===3&&!REDUCED){const cols=['#3aa79a','#e07b3c','#ffd23f','#ff7ab8','#2ec4a6'];for(let i=0;i<50;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=Math.random()+'s';$('#app').appendChild(c);setTimeout(()=>c.remove(),5000)}}
  try{window.parent.postMessage('scoreBarFound','*')}catch(e){}try{window.top.postMessage('scoreBarFound','*')}catch(e){}}

/* ===== Stage ===== */
const SH=600,SMAX=900;
function fitStage(){const a=$('#app'),vw=innerWidth,vh=innerHeight,sc=Math.min(1,vh/SH);a.style.width=Math.min(vw/sc,SMAX)+'px';a.style.top=Math.max(0,(vh-SH*sc)/2)+'px';a.style.transform='translateX(-50%) scale('+sc+')'}
$('#sc-start').insertAdjacentHTML('afterbegin',hallSVG());$('#bd').innerHTML=hallSVG().replace('class="bg"','');
fitStage();addEventListener('resize',fitStage);
</script>
</body>
