<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permen atau Sayuran? – Gamifikasi V18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#14151b;--paper:#fffdf7;--orange:#f2792b;--blue:#3d7fd9;--good:#5fd68c;--red:#ff5a5a;--warn:#ffc94d;
--hand:"Patrick Hand","Comic Sans MS",cursive;--round:"Fredoka","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#c8d7e1;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--hand);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(rgba(30,50,80,.09) 1.5px,transparent 1.7px);background-size:26px 26px}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:absolute;left:50%;top:0;width:100%;height:600px;transform-origin:top center;overflow:hidden;background:linear-gradient(180deg,#e4eef4 0%,#d5e3ec 62%,#c8d7e1 100%)}
#cv{position:absolute;left:0;top:0;width:100%;height:600px;touch-action:none}
.btn{font-family:var(--round);font-weight:600;font-size:16px;padding:10px 18px;border:2.5px solid var(--ink);border-radius:12px;background:var(--orange);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{width:100%;font-size:18px;padding:12px;margin-top:8px}
.btn.ghost{background:#e9edf5}.btn.on{background:var(--warn)}
#hud{position:absolute;left:50%;top:0;width:min(calc(100% - 104px),520px);transform:translateX(-50%);padding:8px 0 0;pointer-events:none;z-index:5}
.chip{display:inline-block;padding:3px 12px;background:#2b303c;color:#fff;border:2.5px solid var(--ink);border-radius:99px;font-family:var(--round);font-weight:600;font-size:13px;margin-bottom:5px}
.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.m{background:#2b303c;border:2.5px solid var(--ink);border-radius:10px;padding:3px 7px 5px;color:#fff;font-family:var(--round);font-size:11.5px}
.m .row{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#14151b;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;width:50%;background:var(--good);transition:width .15s}
#prog{height:5px;background:rgba(0,0,0,.35);margin-top:6px;border-radius:3px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--warn)}
#ovl{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:rgba(4,6,12,.6)}
#ovl.show{display:grid}
.paper{position:relative;width:min(100%,480px);max-height:560px;overflow:hidden;padding:16px 16px 14px 36px;background:repeating-linear-gradient(transparent 0 29px,#dde6f3 29px 30px),var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 var(--ink)}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:19px;width:2px;background:#ff9b9b}
.paper h1,.paper h2{font-weight:400;line-height:1.02;margin-bottom:6px}.paper h1{font-size:34px}.paper h2{font-size:28px}
.paper p{font-size:18px;line-height:1.22;margin-bottom:8px}
.kick{display:inline-block;font-family:var(--round);font-size:12px;background:#e9edf5;border:2px solid var(--ink);border-radius:99px;padding:1px 10px;margin-bottom:6px}
.row2{display:flex;gap:8px;margin:6px 0}.row2 .btn{flex:1}
input{width:100%;font-family:var(--hand);font-size:19px;padding:8px 12px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;user-select:text;-webkit-user-select:text}
input.err{border-color:var(--red)}
.guide{display:flex;gap:10px;align-items:flex-end;margin-bottom:4px}
.spr{flex:none;width:84px;height:252px;background:var(--spr) center bottom/contain no-repeat}
.bub{flex:1;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:7px 12px 6px;margin-bottom:6px}
.bub p{font-size:17px;margin-bottom:5px}.bub p:last-child{margin:0}
.who{display:inline-block;font-family:var(--round);font-weight:600;font-size:12px;background:var(--orange);border:2px solid var(--ink);border-radius:99px;padding:0 9px;margin-bottom:4px}
.tag{display:inline-block;font-family:var(--round);font-weight:600;font-size:14px;border:2.5px solid var(--ink);border-radius:99px;padding:2px 12px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px}
.box{border:2.5px solid var(--ink);border-radius:12px;text-align:center;padding:2px 4px;font-family:var(--round);font-size:12px}.box b{display:block;font-size:24px;line-height:1.1;font-family:var(--hand);font-weight:400}
.qs{font-size:17px;line-height:1.15;margin:0 0 6px 18px}
#hud{z-index:5}
#app.gs1 #hud{z-index:16}#app.gs1 .ms{border-radius:10px;animation:gMeter 1.1s ease-in-out infinite}
@keyframes gMeter{50%{box-shadow:0 0 0 4px #ffd34d,0 0 18px 6px rgba(255,211,77,.8)}}
.g-dim{position:absolute;inset:0;z-index:15;background:rgba(4,6,12,.55);cursor:pointer}
.g-tip{position:absolute;z-index:17;left:0;right:0;margin:0 auto;width:min(420px,calc(100% - 28px));background:#fffdf7;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 12px;font-size:18px;line-height:1.2;cursor:pointer;animation:gTipIn .35s cubic-bezier(.3,1.6,.5,1) both}
.g-tip small{display:block;font-family:var(--round);font-size:12px;color:#6b6858;margin-top:3px}
.g-tip::before{content:"";position:absolute;left:calc(50% - 10px);border:10px solid transparent}
.g-tip.up::before{bottom:100%;border-bottom-color:var(--ink)}.g-tip.dn::before{top:100%;border-top-color:var(--ink)}
@keyframes gTipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.g-hand{position:absolute;z-index:18;left:calc(50% - 22px);top:440px;font-size:44px;pointer-events:none;animation:gHand 1.6s ease-in-out infinite}
@keyframes gHand{0%,100%{transform:translateX(-90px)}50%{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){.g-tip,.g-hand,#app.gs1 .ms{animation:none!important}}
.dbf{width:min(100%,680px)}.dbf .spr{width:76px;height:230px}.dbf .bub p{font-size:16.5px;margin-bottom:4px}.dbf .bub{padding:6px 12px 4px}
#aud{position:absolute;top:7px;right:7px;z-index:30;width:38px;height:38px;padding:0;border-radius:50%;background:var(--warn);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:18px}
#copy{position:absolute;left:0;right:0;bottom:3px;z-index:25;text-align:center;font-family:var(--round);font-size:10px;pointer-events:none}
#copy span{padding:2px 10px;border-radius:99px;background:rgba(20,21,27,.62);color:#fff}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="960" height="1200"></canvas>
  <div id="hud" style="display:none">
    <span class="chip" id="chip"></span>
    <div class="ms">
      <div class="m"><div class="row"><span>❤️ Sehat</span><b id="hv"></b></div><div class="bar"><i id="hb"></i></div></div>
      <div class="m"><div class="row"><span>🗣️ Terbuka</span><b id="ov"></b></div><div class="bar"><i id="ob" style="background:var(--blue)"></i></div></div>
      <div class="m"><div class="row"><span>🍬 Gula</span><b id="sv"></b></div><div class="bar"><i id="sb"></i></div></div>
    </div>
    <div id="prog"><i></i></div>
  </div>
  <div id="ovl"></div>
  <button id="aud" onclick="toggleAudio()" aria-label="Suara">🔊</button>
  <div id="copy"><span>© Education and Training Department 2026</span></div>
</div>
